[package]
name = "rcp"
version = "0.1.0"
edition = "2021"
description = "cp clone with a progress bar and transfer rate"
license = "MIT"

[[bin]]
name = "rcp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3.1.4"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
